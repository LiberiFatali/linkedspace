<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedSpace</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#0d1117"/>
          <path d="M5 11C5 8.79086 6.79086 7 9 7H23C25.2091 7 27 8.79086 27 11V19C27 21.2091 25.2091 23 23 23H18L14 27V23H9C6.79086 23 5 21.2091 5 19V11Z" fill="#1c2333" stroke="#30363d" stroke-width="1"/>
          <path d="M10 15H22M10 15L13 12M10 15L13 18M22 15L19 12M22 15L19 18" stroke="#00D4C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="header-text">
          <span class="app-name">LinkedSpace</span>
          <span class="app-version">v1.3.0</span>
        </div>
      </div>
    </header>

    <!-- Status indicator -->
    <div class="status-card" id="statusCard">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Checking page…</span>
    </div>

    <!-- Main toggle -->
    <div class="control-row">
      <div class="control-info">
        <span class="control-label">Expand LinkedIn</span>
        <span class="control-desc">Full-width across tabs</span>
      </div>
      <label class="toggle" for="masterToggle" aria-label="Enable LinkedSpace">
        <input type="checkbox" id="masterToggle" checked />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>

    <!-- Feature pills -->
    <div class="features">
      <div class="feature-pill">
        <svg class="feature-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 8H14M2 8L5 5M2 8L5 11M14 8L11 5M14 8L11 11" stroke="#00D4C8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Full Width
      </div>
      <div class="feature-pill">
        <svg class="feature-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M1 8H15M1 8L4 5M1 8L4 11M15 8L12 5M15 8L12 11" stroke="#00D4C8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="8" y1="3" x2="8" y2="13" stroke="#00D4C8" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round"/>
        </svg>
        All Tabs
      </div>
      <div class="feature-pill">
        <svg class="feature-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13 3L6 10M6 10H10M6 10V6" stroke="#00D4C8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="2" y="2" width="5" height="5" rx="1" stroke="#00D4C8" stroke-width="1.5"/>
        </svg>
        Auto-Apply
      </div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Open LinkedIn button -->
    <a href="https://www.linkedin.com/feed/" target="_blank" rel="noopener noreferrer" class="open-btn" id="openLinkedIn">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Open LinkedIn
    </a>

    <!-- Footer -->
    <footer class="footer">
      LinkedIn is a trademark of LinkedIn Corporation. LinkedSpace is an independent extension.
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
